<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Soma Yagna Selfie Point</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📸 Generate Your Poster</h1>

        <div id="capture-section">
            <form id="details-form">
                <input type="text" id="name" placeholder="Enter Name" required>
                <input type="tel" id="phone" placeholder="Enter Phone Number (Optional)">
            </form>

            <video id="video" autoplay></video>
            <button id="capture-btn">1. Capture Photo</button>
        </div>

        <div id="result-section" style="display: none;">
            <h2>✨ Your Poster is Ready!</h2>
            <canvas id="poster-canvas" width="600" height="300"></canvas>
            
            <button id="download-btn">2. Download Poster</button>
            <button id="reset-btn">Start Over</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
